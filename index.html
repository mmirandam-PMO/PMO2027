<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portafolio de Proyectos 2027 · PMO</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Merriweather:wght@800;900&display=swap" rel="stylesheet">
</head>
<body>

  <header class="masthead">
    <div class="wrap header-inner">
      <div class="brand">
         <h1>Portafolio de Proyectos 2027</h1>
        <span class="brand-top">3 Programas   ·  38 Proyectos</span>
             </div>
      <!-- Cambio solicitado: de Tablero a Proyecto -->
      <div class="nav-area">
        <a href="#" class="nav-button" style="color: white; text-decoration: none; font-weight: 700; font-size: 14px;">⬅ Regresar al Proyecto</a>
      </div>
      <div class="search-area">
        <input type="text" id="search-input" placeholder="Buscar...">
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="dashboard-grid">
      <div class="column" id="col-1"></div>
      <div class="column" id="col-2"></div>
      <div class="column" id="col-3"></div>
    </div>

    <!-- Sección de Timeline con el fondo gris configurado por CSS -->
    <div class="timeline-container">
      <h3 style="margin-bottom: 10px; color: var(--navy);">Línea de Tiempo del Portafolio (Timeline)</h3>
      <div class="roadmap-timeline">
        <!-- Los bloques de render dinámico del timeline van aquí -->
        <p style="font-size: 13px; color: var(--text-dark);">Visualización del Roadmap estructurado por Q1, Q2, Q3 y Q4 2027.</p>
      </div>
    </div>
  </main>

  <script src="roadmap-data.js"></script>
  <script src="app-render.js"></script>
</body>
</html>
