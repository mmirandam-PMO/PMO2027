<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roadmap 2027 · PMO</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="masthead">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-top">PORTAFOLIO DE PROYECTOS 2027 · PMO</span>
        <h1>Tablero de Control Operativo</h1>
      </div>
    </div>
  </header>

  <!-- Pestañas Superiores: Ahora cambia el estado activo -->
  <div class="wrap">
    <div class="navigation-tabs">
      <a href="index.html" class="tab-link">Tablero</a>
      <a href="roadmap.html" class="tab-link active">Resumen semanal</a>
    </div>
  </div>

  <main class="wrap">
    <div class="roadmap-container">
      <table class="roadmap-table">
        <thead>
          <!-- Fila de Trimestres (Qs) Estilo Corporativo -->
          <tr>
            <th class="meta-col" style="width: 20%;">Proyecto</th>
            <th class="meta-col" style="width: 15%;">Responsable</th>
            <th colspan="3" class="q-header">Q1 2027</th>
            <th colspan="3" class="q-header">Q2 2027</th>
            <th colspan="3" class="q-header">Q3 2027</th>
            <th colspan="3" class="q-header">Q4 2027</th>
          </tr>
          <!-- Fila de Meses individuales -->
          <tr class="months-sub-header">
            <th class="meta-col"></th>
            <th class="meta-col"></th>
            <th>Ene</th><th>Feb</th><th>Mar</th>
            <th>Abr</th><th>May</th><th>Jun</th>
            <th>Jul</th><th>Ago</th><th>Sep</th>
            <th>Oct</th><th>Nov</th><th>Dic</th>
          </tr>
        </thead>
        <tbody id="roadmap-tbody">
          <!-- Renderizado automático e inteligente -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="data.js"></script>
  <script>
    function renderRoadmap() {
      const tbody = document.getElementById('roadmap-tbody');
      let html = '';

      pmoData.programas.forEach(programa => {
        let proyectos = [];
        if (programa.categorias) programa.categorias.forEach(c => proyectos = proyectos.concat(c.proyectos));
        if (programa.subprogramas) programa.subprogramas.forEach(sp => proyectos = proyectos.concat(sp.proyectos));
        if (programa.transversales) programa.transversales.forEach(t => proyectos = proyectos.concat(t.proyectos));

        proyectos.forEach(proj => {
          if (proj.nombre.startsWith('•')) return;

          // Extraer límites de meses reales mapeados en data.js
          const start = proj.startMonth || 1;
          const end = proj.endMonth || 12;

          const leftPercent = ((start - 1) * 8.333);
          const widthPercent = ((end - start + 1) * 8.333);

          html += `
            <tr>
              <td class="proj-cell-title">${proj.nombre}</td>
              <td class="proj-cell-owner">${proj.responsable || 'TBD'}</td>
              <td colspan="12" class="timeline-container-cell">
                <div class="timeline-wrapper">
                  <div class="timeline-bar" style="left: calc(${leftPercent}% + 4px); width: calc(${widthPercent}% - 8px);"></div>
                </div>
              </td>
            </tr>
          `;
        });
      });

      tbody.innerHTML = html;
    }
    window.addEventListener('DOMContentLoaded', renderRoadmap);
  </script>
</body>
</html>
