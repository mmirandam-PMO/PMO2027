<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio de Proyectos 2027 · PMO</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado -->
  <header class="masthead">
    <div class="wrap header-inner">
      <div class="brand">
        <p class="brand-top">3 Programas &nbsp;•&nbsp; 38 Proyectos</p>
        <h1>Portafolio de Proyectos 2027</h1>
      </div>
      <div class="search-area">
        <input type="text" id="search-input" placeholder="🔍 Buscar proyecto o responsable...">
      </div>
    </div>
  </header>

  <!-- Bloques de Indicadores (KPIs) -->
  <section class="wrap">
    <div class="kpis-grid">
      <div class="kpi blue">
        <span class="kpi-label">Focos Estratégicos</span>
        <span class="kpi-val">3</span>
        <span class="kpi-sub">Programas Core</span>
      </div>
      <div class="kpi teal">
        <span class="kpi-label">Volumen Operativo</span>
        <span class="kpi-val">38</span>
        <span class="kpi-sub">Proyectos Activos</span>
      </div>
      <div class="kpi orange">
        <span class="kpi-label">Esfuerzo Transversal</span>
        <span class="kpi-val">13</span>
        <span class="kpi-sub">Proyectos en Carry-over</span>
      </div>
      <div class="kpi gold">
        <span class="kpi-label">Estatus Crítico</span>
        <span class="kpi-val" id="tbd-counter">0</span>
        <span class="kpi-sub">Por asignar / TBD</span>
      </div>
    </div>
  </section>

  <!-- Tablero en 3 Columnas Fijas para evitar desfases -->
  <main class="wrap">
    <div class="dashboard-grid" id="dashboard">
      <div class="column" id="col-1"></div>
      <div class="column" id="col-2"></div>
      <div class="column" id="col-3"></div>
    </div>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
