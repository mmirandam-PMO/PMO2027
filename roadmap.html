<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roadmap 2027 · PMO</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="masthead">
    <div class="wrap header-inner">
      <div class="brand-block">
        <h1 class="main-title">Portafolio de Proyectos 2027</h1>
        <div class="sub-meta">
          <a href="#" class="meta-link">3 Programas</a> · <a href="#" class="meta-link">38 Proyectos</a>
        </div>
      </div>
      
      <div class="navigation-tabs">
        <a href="index.html" class="tab-link">Tablero</a>
        <a href="roadmap.html" class="tab-link active">Resumen semanal</a>
      </div>

      <div class="search-area" style="opacity: 0; pointer-events: none;">
        <input type="text" placeholder="Buscar">
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="roadmap-container">
      <table class="roadmap-table">
        <thead>
          <tr>
            <th class="meta-col" style="width: 25%;">Proyecto</th>
            <th class="meta-col" style="width: 20%;">Responsable</th>
            <th class="q-header" style="width: 13.75%;">Q1 2027</th>
            <th class="q-header" style="width: 13.75%;">Q2 2027</th>
            <th class="q-header" style="width: 13.75%;">Q3 2027</th>
            <th class="q-header" style="width: 13.75%;">Q4 2027</th>
          </tr>
        </thead>
        <tbody id="roadmap-tbody">
          <!-- Renderizado dinámico limpio -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="data.js"></script>
  <script>
    function renderRoadmap() {
      const tbody = document.getElementById('roadmap-tbody');
      let html = '';

      pmoData.programas.forEach(programa => {
        let proyectos = [];
        if (programa.categorias) programa.categorias.forEach(c => proyectos = proyectos.concat(c.proyectos));
        if (programa.subprogramas) programa.subprogramas.forEach(sp => proyectos = proyectos.concat(sp.proyectos));
        if (programa.transversales) programa.transversales.forEach(t => proyectos = proyectos.concat(t.proyectos));

        proyectos.forEach(proj => {
          if (proj.nombre.startsWith('•')) return;

          // Mapeo adaptado exclusivamente a bloques por cuarto (Q)
          const start = proj.startMonth || 1;
          const end = proj.endMonth || 12;

          // Convertir rango de meses a porcentaje sobre los 4 Qs
          const leftPercent = ((start - 1) * 8.333);
          const widthPercent = ((end - start + 1) * 8.333);

          html += `
            <tr>
              <td class="proj-cell-title">${proj.nombre}</td>
              <td class="proj-cell-owner">${proj.responsable || 'S. Olivero'}</td>
              <td colspan="4" class="timeline-container-cell">
                <div class="timeline-wrapper">
                  <div class="timeline-bar" style="left: ${leftPercent}%; width: ${widthPercent}%;"></div>
                </div>
              </td>
            </tr>
          `;
        });
      });

      tbody.innerHTML = html;
    }
    window.addEventListener('DOMContentLoaded', renderRoadmap);
  </script>
</body>
</html>
