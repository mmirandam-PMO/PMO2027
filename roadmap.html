<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roadmap 2027 · PMO</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <!-- Reutiliza tus mismos estilos corporativos existentes sin cambiarlos -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Lector automático integrado para tu archivo data.csv -->
  <script src="https://cloudflare.com"></script>

  <style>
    /* Estructura del encabezado idéntica a tu index.html */
    .brand-flex-layout {
      display: flex;
      align-items: flex-end;
      gap: 18px;
      flex-wrap: wrap;
    }
    .btn-executive-roadmap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.25);
      margin-bottom: 2px;
      transition: all 0.2s ease;
    }
    .btn-executive-roadmap:hover {
      background: #ffffff;
      color: #1B355D;
    }

    /* Estructuración del Diagrama Gantt por Trimestres (Q) */
    .gantt-box { 
      background: var(--white); 
      border-radius: var(--radius); 
      box-shadow: var(--shadow); 
      overflow: hidden; 
      border: 1px solid var(--border); 
      margin-top: 20px; 
    }
    .gantt-title-row { 
      display: grid; 
      grid-template-columns: 2.5fr 1fr repeat(4, 1fr); 
      background: var(--navy); 
      color: var(--white); 
      font-size: 13px; 
      font-weight: 700; 
      text-align: center; 
    }
    .gantt-title-row div { 
      padding: 14px; 
      border-right: 1px solid rgba(255, 255, 255, 0.1); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    .gantt-title-row .align-left { 
      justify-content: flex-start; 
      padding-left: 20px; 
    }
    .gantt-row { 
      display: grid; 
      grid-template-columns: 2.5fr 1fr 4fr; 
      border-bottom: 1px solid var(--border); 
      align-items: center; 
      background: var(--white); 
    }
    .gantt-row:last-child { border-bottom: none; }
    .cell-info { padding: 14px 20px; font-size: 13.5px; }
    .cell-info small { display: block; font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }
    .cell-info span { font-weight: 500; color: var(--text-dark); }
    .cell-lead { padding: 14px; font-size: 12px; color: #4A5568; font-weight: 700; }
    .timeline-track { display: grid; grid-template-columns: repeat(4, 1fr); height: 100%; position: relative; align-items: center; border-left: 1px solid var(--border); }
    .q-divider { height: 100%; border-right: 1px solid #EDF2F7; }
    .gantt-bar-fill { position: absolute; height: 10px; background: #A3BFFA; border-radius: 20px; z-index: 5; }
  </style>
</head>
<body>

  <header class="masthead">
    <div class="wrap header-inner">
      <div class="brand">
        <!-- Mismo nombre institucional intacto -->
        <span class="brand-top">PORTAFOLIO DE PROYECTOS 2027 · PMO</span>
        <div class="brand-flex-layout">
          <!-- Título cambiado a Roadmap 2027 -->
          <h1>Roadmap 2027</h1>
          <!-- Botón de regreso estilizado con la misma clase corporativa -->
          <a href="index.html" class="btn-executive-roadmap">
            ⬅️ Regresar al Tablero
          </a>
        </div>
      </div>
      <div class="search-area">
        <input type="text" id="gantt-search" placeholder="🔍 Buscar proyecto o responsable...">
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="gantt-box">
      <!-- Encabezado de la línea de tiempo por Qs -->
      <div class="gantt-title-row">
        <div class="align-left">Proyecto</div>
        <div class="align-left">Responsable</div>
        <div>Q1 2027</div>
        <div>Q2 2027</div>
        <div>Q3 2027</div>
        <div>Q4 2027</div>
      </div>
      <!-- Espacio donde se renderizan los datos filtrados con fecha -->
      <div id="gantt-content"></div>
    </div>
  </main>

  <script>
    let rawExcelData = [];

    // Función matemática para posicionar proporcionalmente la barra en los trimestres de 2027
    function getYearPercentage(dateString) {
      const current = new Date(dateString);
      const start = new Date('2027-01-01');
      const end = new Date('2027-12-31');
      const percentage = ((current - start) / (end - start)) * 100;
      return Math.min(Math.max(percentage, 0), 100);
    }

    // Renderizador dinámico de filas
    function renderGantt() {
      const container = document.getElementById('gantt-content');
      if (!container) return;
      container.innerHTML = '';

      const term = document.getElementById('gantt-search').value.toLowerCase().trim();

      rawExcelData.forEach(row => {
        const clasi = row["Clasificación"] || "";
        const proy = row["Proyecto"] || "";
        const resp = row["Responsable"] || "";
        const inicio = row["Fecha de inicio"] || "";
        const fin = row["Fecha de fin"] || "";

        // Condición estricta: Solo procesar lo que tenga fechas en el CSV
        if (!inicio || !fin) return;

        if (proy.toLowerCase().includes(term) || resp.toLowerCase().includes(term) || clasi.toLowerCase().includes(term)) {
          const leftPercent = getYearPercentage(inicio);
          const rightPercent = getYearPercentage(fin);
          const barWidth = Math.max(rightPercent - leftPercent, 3);

          const divRow = document.createElement('div');
          divRow.className = 'gantt-row';
          divRow.innerHTML = `
            <div class="cell-info"><small>${clasi}</small><span>${proy}</span></div>
            <div class="cell-lead">${resp || '--'}</div>
            <div class="timeline-track">
              <div class="q-divider"></div><div class="q-divider"></div><div class="q-divider"></div><div class="q-divider"></div>
              <div class="gantt-bar-fill" style="left: ${leftPercent}%; width: ${barWidth}%;"></div>
            </div>
          `;
          container.appendChild(divRow);
        }
      });
    }

    // Carga automatizada del archivo local data.csv
    window.addEventListener('DOMContentLoaded', () => {
      Papa.parse("data.csv", {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          rawExcelData = results.data;
          renderGantt();
        }
      });
    });

    document.getElementById('gantt-search').addEventListener('input', renderGantt);
  </script>
</body>
</html>
