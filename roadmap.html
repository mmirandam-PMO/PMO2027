<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resumen Semanal - Roadmap 2027</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --navy-pmo: #1B355D;
      --bg-roadmap: #F4F6F9;
      --white-card: #ffffff;
      --border-light: #E5E9F0;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --shadow-soft: 0 4px 12px rgba(0, 0, 0, 0.03);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-roadmap); color: var(--text-main); min-height: 100vh; }
    .wrap { max-width: 1440px; margin: 0 auto; padding: 0 34px; }

    header.masthead-rm {
      padding: 30px 0 15px 0;
    }
    .header-inner-rm { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }

    .brand-block-rm { display: flex; flex-direction: column; }
    .main-title-rm { font-size: 26px; font-weight: 700; color: var(--navy-pmo); letter-spacing: -0.5px; }
    .sub-meta-rm { font-size: 13px; font-weight: 500; color: var(--text-muted); margin-top: 4px; }

    .search-area-rm input { 
      border: 1px solid #CBD5E1; 
      border-radius: 8px; 
      padding: 10px 16px; 
      width: 260px; 
      font-size: 14px; 
      outline: none; 
      background: var(--white-card); 
    }

    .navigation-tabs-rm {
      display: inline-flex;
      background: #E2ECF9;
      padding: 4px;
      border-radius: 30px;
    }
    .tab-link-rm {
      padding: 8px 24px;
      font-size: 14px;
      font-weight: 600;
      color: var(--navy-pmo);
      text-decoration: none;
      border-radius: 25px;
    }
    .tab-link-rm.active {
      background: #6C9CE4;
      color: var(--white-card);
    }

    /* Estructura limpia Gantt por Qs sin efecto Excel */
    .roadmap-container-rm { background: transparent; margin-top: 25px; }
    .roadmap-table-rm { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
    
    .roadmap-table-rm th { color: var(--text-muted); font-size: 12px; font-weight: 600; padding: 8px 16px; text-align: center; text-transform: uppercase; }
    .roadmap-table-rm th.meta-col-rm { text-align: left; }

    .roadmap-table-rm tr { background: var(--white-card); box-shadow: var(--shadow-soft); }
    .roadmap-table-rm td { padding: 16px; border-top: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light); font-size: 14px; background: var(--white-card); }
    
    .roadmap-table-rm td:first-child { border-left: 1px solid var(--border-light); border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
    .roadmap-table-rm td:last-child { border-right: 1px solid var(--border-light); border-top-right-radius: 10px; border-bottom-right-radius: 10px; }

    .proj-cell-title-rm { font-weight: 600; color: var(--navy-pmo); }
    
    /* Espacio reducido para el responsable */
    .proj-cell-owner-rm { color: var(--text-muted); font-weight: 500; font-size: 13px; white-space: nowrap; }

    /* Estilo de Etiquetas de Clasificación */
    .classification-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .tag-minorista { background: #EBF5FB; color: #2980B9; }
    .tag-regulatorios { background: #FBEEE6; color: #A04000; }
    .tag-mayorista { background: #FEF9E7; color: #D35400; }
    .tag-default { background: #F2F4F7; color: #475569; }

    /* Contenedor del Timeline */
    .timeline-container-cell-rm { padding: 0 20px !important; position: relative; width: 45%; }
    .timeline-wrapper-rm { position: relative; height: 16px; width: 100%; background: #F1F5F9; border-radius: 20px; overflow: hidden; }
    .timeline-bar-rm { position: absolute; top: 0; bottom: 0; background: #9EC2F7; border-radius: 20px; }
  </style>
</head>
<body>

  <header class="masthead-rm">
    <div class="wrap header-inner-rm">
      <div class="brand-block-rm">
        <h1 class="main-title-rm">Portafolio de Proyectos 2027</h1>
        <div class="sub-meta-rm">3 Programas · 38 Proyectos</div>
      </div>
      
      <div class="navigation-tabs-rm">
        <a href="index.html" class="tab-link-rm">Tablero</a>
        <a href="roadmap.html" class="tab-link-rm active">Resumen semanal</a>
      </div>

      <div class="search-area-rm">
        <input type="text" id="search-input-rm" placeholder="Buscar">
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="roadmap-container-rm">
      <table class="roadmap-table-rm">
        <thead>
          <tr>
            <th class="meta-col-rm" style="width: 15%;">Clasificación</th>
            <th class="meta-col-rm" style="width: 25%;">Proyecto</th>
            <th class="meta-col-rm" style="width: 15%;">Responsable</th>
            <th style="width: 11.25%;">Q1 2027</th>
            <th style="width: 11.25%;">Q2 2027</th>
            <th style="width: 11.25%;">Q3 2027</th>
            <th style="width: 11.25%;">Q4 2027</th>
          </tr>
        </thead>
        <tbody id="roadmap-tbody-rm">
          <!-- Renderizado inteligente basado en data.js -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="data.js"></script>
  <script>
    function getTagClass(progName) {
      if (progName.includes('Minorista')) return 'tag-minorista';
      if (progName.includes('Regulatorios')) return 'tag-regulatorios';
      if (progName.includes('Mayorista')) return 'tag-mayorista';
      return 'tag-default';
    }

    function renderStandaloneRoadmap(filterTerm = '') {
      const tbody = document.getElementById('roadmap-tbody-rm');
      let html = '';

      if (!window.pmoData || !pmoData.programas) return;

      pmoData.programas.forEach(programa => {
        let proyectos = [];
        if (programa.categorias) programa.categorias.forEach(c => proyectos = proyectos.concat(c.proyectos));
        if (programa.subprogramas) programa.subprogramas.forEach(sp => proyectos = proyectos.concat(sp.proyectos));
        if (programa.transversales) programa.transversales.forEach(t => proyectos = proyectos.concat(t.proyectos));

        proyectos.forEach((proj, idx) => {
          if (proj.nombre.startsWith('•')) return;

          const nameMatch = proj.nombre.toLowerCase().includes(filterTerm);
          const ownerMatch = (proj.responsable || '').toLowerCase().includes(filterTerm);
          if (filterTerm && !nameMatch && !ownerMatch) return;

          // Asignación de rangos de meses dinámicos simulando tus capturas corporativas
          let start = 3; 
          let end = 8;   
          if (idx % 4 === 1) { start = 4; end = 10; }
          if (idx % 4 === 2) { start = 5; end = 9; }
          if (idx % 4 === 3) { start = 1; end = 5; }

          const leftPercent = ((start - 1) * 8.333);
          const widthPercent = ((end - start + 1) * 8.333);
          const tagClass = getTagClass(programa.nombre);

          html += `
            <tr>
              <td><span class="classification-tag ${tagClass}">${programa.nombre}</span></td>
              <td class="proj-cell-title-rm">${proj.nombre}</td>
              <td class="proj-cell-owner-rm">${proj.responsable || 'S. Olivero'}</td>
              <td colspan="4" class="timeline-container-cell-rm">
                <div class="timeline-wrapper-rm">
                  <div class="timeline-bar-rm" style="left: ${leftPercent}%; width: ${widthPercent}%;"></div>
                </div>
              </td>
            </tr>
          `;
        });
      });

      tbody.innerHTML = html;
    }

    document.getElementById('search-input-rm').addEventListener('input', (e) => {
      renderStandaloneRoadmap(e.target.value.toLowerCase().trim());
    });

    window.addEventListener('DOMContentLoaded', () => renderStandaloneRoadmap());
  </script>
</body>
</html>
