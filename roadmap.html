<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roadmap 2027 · PMO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1B355D;
      --bg-main: #F7F8FA;
      --white: #ffffff;
      --border: #E1E4E8;
      --text-dark: #24292F;
      --text-muted: #6B7280;
      --shadow: 0 4px 16px rgba(27, 42, 74, 0.08);
      --radius: 14px;
      
      /* Colores Solicitados */
      --timeline-bar: #B1CDEE;
      --timeline-bg: #F6F7F9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-dark); min-height: 100vh; padding-bottom: 40px; }
    .wrap { max-width: 1440px; margin: 0 auto; padding: 0 34px; }

    header.masthead {
      background: linear-gradient(90deg, var(--navy) 0%, #1B4E5A 100%);
      color: var(--white);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 14px rgba(27,42,74,.28);
      margin-bottom: 28px;
    }
    .header-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; }
    .brand-top { font-size: 11px; text-transform: uppercase; font-weight: 700; color: #7DACE2; letter-spacing: .5px; }
    .brand h1 { font-family: 'Merriweather', serif; font-size: 22px; font-weight: 900; display: flex; align-items: center; gap: 12px; }
    
    .btn-back {
      background: rgba(255, 255, 255, 0.15);
      color: var(--white);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-back:hover { background: rgba(255, 255, 255, 0.25); }

    .search-area input { 
      background: rgba(255,255,255,0.15); 
      color: var(--white); 
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 10px; 
      padding: 8px 14px; 
      width: 280px; 
      font-size: 13px; 
      outline: none; 
    }
    .search-area input::placeholder { color: rgba(255,255,255,0.7); }
    .search-area input:focus { background: var(--white); color: var(--text-dark); }

    /* Estructura del Grid sin Tablas Tradicionales */
    .roadmap-container { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }

    .roadmap-header-row {
      display: grid;
      grid-template-columns: 180px 1fr 180px 400px;
      gap: 16px;
      padding: 0 20px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      align-items: center;
    }

    .timeline-quarters { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; }

    /* Diseño Moderno de Tarjetas */
    .roadmap-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 180px 1fr 180px 400px;
      gap: 16px;
      padding: 16px 20px;
      align-items: center;
      transition: transform 0.15s, background 0.15s;
      border: 1px solid transparent;
    }
    .roadmap-card:hover {
      transform: translateX(3px);
      background: #FAFBFC;
      border-color: var(--border);
    }

    /* Columna de Clasificaciones */
    .col-classification { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 6px; display: inline-block; width: fit-content; }
    .class-minorista { background: rgba(74, 144, 226, 0.1); color: #2980B9; }
    .class-mayorista { background: rgba(211, 84, 0, 0.1); color: #D35400; }
    .class-nuevos { background: rgba(155, 89, 182, 0.1); color: #8E44AD; }
    .class-carryover { background: rgba(52, 73, 94, 0.1); color: #34495E; }
    .class-default { background: rgba(127, 140, 141, 0.1); color: #7F8C8D; }

    .col-project { font-size: 14px; font-weight: 600; color: var(--navy); line-height: 1.4; }
    .col-responsible { font-size: 13px; font-weight: 500; color: #4A5568; }
    .col-responsible.tbd { color: #E85301; font-weight: 600; }

    /* Estilización del Timeline solicitado */
    .col-timeline {
      background: var(--timeline-bg);
      height: 36px;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    .timeline-grid-lines {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      pointer-events: none;
    }
    .timeline-grid-line { border-right: 1px dashed rgba(0, 0, 0, 0.05); }
    .timeline-grid-line:last-child { border-right: none; }

    .timeline-bar {
      position: absolute;
      height: 14px;
      background: var(--timeline-bar);
      border-radius: 20px;
      transition: all 0.3s ease;
    }

    @media (max-width: 1100px) {
      .roadmap-header-row, .roadmap-card { grid-template-columns: 140px 1fr 140px 280px; }
    }
    @media (max-width: 768px) {
      .roadmap-header-row { display: none; }
      .roadmap-card { grid-template-columns: 1fr; gap: 10px; padding: 16px; }
      .col-timeline { margin-top: 8px; }
    }
  </style>
</head>
<body>

  <header class="masthead">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-top">Portafolio de Proyectos 2027 · PMO</span>
        <h1>
          <a href="#" class="btn-back">⬅ Regresar al Tablero</a>
          Roadmap 2027
        </h1>
      </div>
      <div class="search-area">
        <input type="text" id="search-input" placeholder="Buscar proyecto, responsable o clasificación...">
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="roadmap-header-row">
      <div>Clasificación</div>
      <div>Proyecto</div>
      <div>Responsable</div>
      <div class="timeline-quarters">
        <div>1Q</div>
        <div>2Q</div>
        <div>3Q</div>
        <div>4Q</div>
      </div>
    </div>

    <div class="roadmap-container" id="roadmap-container"></div>
  </main>

  <script>
    const excelData = [
      { clasificacion: "Banca Minorista", proyecto: "Aplicación de inversiones MVP 2", responsable: "S. Olivero", inicio: "2027-01-01", fin: "2027-12-31" },
      { clasificacion: "Banca Minorista", proyecto: "Rediseño Proceso de Originación MVP 2 ", responsable: "S. Olivero", inicio: "2027-04-01", fin: "2027-11-15" }, 
      { clasificacion: "Banca Minorista", proyecto: "Copiloto MVP 2", responsable: "S. Olivero", inicio: "2027-03-01", fin: "2027-09-30" },
      { clasificacion: "Banca Minorista", proyecto: "Seguros RANMA", responsable: "S. Olivero", inicio: "2027-05-01", fin: "2027-11-30" },
      { clasificacion: "Banca Minorista", proyecto: "Créditos Asociados a Nómina (CAN)", responsable: "S. Olivero", inicio: "2027-01-01", fin: "2027-12-31" },
      { clasificacion: "Banca Minorista", proyecto: "Cash Loans", responsable: "S. Olivero", inicio: "2027-01-01", fin: "2027-12-31" },
      { clasificacion: "Banca Minorista", proyecto: "Personalización de ofertas", responsable: "S. Olivero", inicio: "2027-01-01", fin: "2027-12-31" },
      { clasificacion: "Banca Mayorista", proyecto: "Plataforma Banca Empresarial (Fase 1) - PyME Empresa Mediana y Grupos Corporativos", responsable: "R.Galindo, R. Vázquez, B.Flores", inicio: "2027-01-01", fin: "2027-12-31" },
      { clasificacion: "Banca Mayorista", proyecto: "Banca Electrónica Móvil", responsable: "--", inicio: "2027-01-01", fin: "2027-12-31" },
      { clasificacion: "Banca Mayorista", proyecto: "Dispersión de Nóminas", responsable: "--", inicio: "2027-02-01", fin: "2027-10-31" },
      { clasificacion: "Banca Mayorista", proyecto: "Hub de pagos", responsable: "--", inicio: "2027-01-01", fin: "2027-12-31" },
      { clasificacion: "Banca Mayorista", proyecto: "Liquidez (Cash Management)", responsable: "--", inicio: "2027-04-01", fin: "2027-12-31" },
      { clasificacion: "Banca Mayorista", proyecto: "Créditos para Empresas", responsable: "--", inicio: "2027-01-01", fin: "2027-12-31" },
      { clasificacion: "Banca Mayorista", proyecto: "Otros", responsable: "--", inicio: "2027-01-01", fin: "2027-12-31" },
      { clasificacion: "Banca Mayorista", proyecto: "Banco recaudador", responsable: "R. Vázquez", inicio: "2027-01-01", fin: "2027-12-31" },
      { clasificacion: "Banca Minorista", proyecto: "Aplicación de inversiones MVP 1", responsable: "S. Olivero", inicio: "2027-01-01", fin: "2027-06-30" },
      { clasificacion: "Banca Minorista", proyecto: "Rediseño Proceso de Originación MVP 1 ", responsable: "S. Olivero", inicio: "2027-01-01", fin: "2027-06-30" },
      { clasificacion: "Banca Minorista", proyecto: "Copiloto MVP 1", responsable: "S. Olivero", inicio: "2027-01-01", fin: "2027-06-30" },
      { clasificacion: "Nuevos proyectos", proyecto: "CRM Objetivo", responsable: "M. Matus", inicio: "2027-01-01", fin: "2027-12-31" },
      { clasificacion: "Nuevos proyectos", proyecto: "Content Manager Objetivo (Filenet)", responsable: "M. Matus", inicio: "2027-01-01", fin: "2027-01-31" },
      { clasificacion: "Nuevos proyectos", proyecto: "Implementación Middleware (Greenfield)", responsable: "M. Matus", inicio: "2027-01-01", fin: "2027-01-31" },
      { clasificacion: "Carryover 2026", proyecto: "Robustecimiento BKAYA 2026", responsable: "M. Matus", inicio: "2027-01-01", fin: "2027-01-31" }
    ];

    function getClassificationClass(cls) {
      const clean = cls.toLowerCase();
      if (clean.includes("minorista")) return "class-minorista";
      if (clean.includes("mayorista")) return "class-mayorista";
      if (clean.includes("nuevos")) return "class-nuevos";
      if (clean.includes("carryover")) return "class-carryover";
      return "class-default";
    }

    function calculateTimelinePosition(startStr, endStr) {
      const yearStart = new Date("2027-01-01").getTime();
      const yearEnd = new Date("2027-12-31").getTime();
      const totalDuration = yearEnd - yearStart;

      const currentStart = new Date(startStr).getTime();
      const currentEnd = new Date(endStr).getTime();

      const startClamped = Math.max(yearStart, Math.min(yearEnd, currentStart));
      const endClamped = Math.max(yearStart, Math.min(yearEnd, currentEnd));

      const leftPercent = ((startClamped - yearStart) / totalDuration) * 100;
      const widthPercent = ((endClamped - startClamped) / totalDuration) * 100;

      return {
        left: leftPercent.toFixed(2) + "%",
        width: Math.max(widthPercent, 3).toFixed(2) + "%"
      };
    }

    function renderRoadmap() {
      const container = document.getElementById("roadmap-container");
      const searchTerm = document.getElementById("search-input").value.toLowerCase().trim();
      container.innerHTML = "";

      excelData.forEach(item => {
        const matchesCls = item.clasificacion.toLowerCase().includes(searchTerm);
        const matchesProj = item.proyecto.toLowerCase().includes(searchTerm);
        const matchesResp = item.responsable.toLowerCase().includes(searchTerm);

        if (matchesCls || matchesProj || matchesResp || searchTerm === "") {
          const isTbd = !item.responsable || item.responsable === "--" || item.responsable === "TBD";
          const classStyle = getClassificationClass(item.clasificacion);
          const pos = calculateTimelinePosition(item.inicio, item.fin);

          const cardHtml = `
            <div class="roadmap-card">
              <div><span class="col-classification ${classStyle}">${item.clasificacion}</span></div>
              <div class="col-project">${item.proyecto}</div>
              <div class="col-responsible ${isTbd ? 'tbd' : ''}">${item.responsable}</div>
              <div class="col-timeline">
                <div class="timeline-grid-lines">
                  <div class="timeline-grid-line"></div>
                  <div class="timeline-grid-line"></div>
                  <div class="timeline-grid-line"></div>
                  <div class="timeline-grid-line"></div>
                </div>
                <div class="timeline-bar" style="left: ${pos.left}; width: ${pos.width};"></div>
              </div>
            </div>
          `;
          container.insertAdjacentHTML("beforeend", cardHtml);
        }
      });
    }

    document.getElementById("search-input").addEventListener("input", renderRoadmap);
    window.addEventListener("DOMContentLoaded", renderRoadmap);
  </script>
</body>
</html>
